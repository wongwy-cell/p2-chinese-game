<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>二年級中文溫習遊戲｜第一學段</title>
<style>
  :root {
    --primary: #4CAF50;
    --primary-dark: #388E3C;
    --accent: #FF9800;
    --accent-dark: #F57C00;
    --bg: #E8F5E9;
    --card: #FFFFFF;
    --text: #2E7D32;
    --wrong: #E53935;
    --correct: #43A047;
    --star: #FFD700;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    background: linear-gradient(160deg, #E8F5E9 0%, #C8E6C9 50%, #A5D6A7 100%);
    min-height: 100vh;
    color: #333;
    overflow-x: hidden;
  }
  .container {
    max-width: 520px;
    margin: 0 auto;
    padding: 16px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  /* Header */
  header {
    text-align: center;
    padding: 12px 0 8px;
  }
  header h1 {
    font-size: 1.55rem;
    color: var(--text);
    text-shadow: 1px 1px 0 #fff;
  }
  header .sub {
    font-size: 0.85rem;
    color: #555;
    margin-top: 4px;
  }
  /* Screens */
  .screen { display: none; flex: 1; flex-direction: column; }
  .screen.active { display: flex; }
  /* Home */
  .home-card {
    background: var(--card);
    border-radius: 20px;
    padding: 24px 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    margin-top: 12px;
    text-align: center;
  }
  .mascot {
    font-size: 4rem;
    line-height: 1;
    margin-bottom: 8px;
    animation: bounce 1.2s ease infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .mode-btn {
    display: block;
    width: 100%;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    border: none;
    border-radius: 14px;
    padding: 16px 12px;
    font-size: 1.15rem;
    font-weight: 700;
    margin: 10px 0;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(76,175,80,0.4);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .mode-btn:active { transform: scale(0.97); }
  .mode-btn.orange {
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    box-shadow: 0 4px 12px rgba(255,152,0,0.4);
  }
  .mode-btn.purple {
    background: linear-gradient(135deg, #7B1FA2, #9C27B0);
    box-shadow: 0 4px 12px rgba(156,39,176,0.4);
  }
  .mode-btn.blue {
    background: linear-gradient(135deg, #0288D1, #03A9F4);
    box-shadow: 0 4px 12px rgba(3,169,244,0.4);
  }
  .mode-btn.pink {
    background: linear-gradient(135deg, #C2185B, #E91E63);
    box-shadow: 0 4px 12px rgba(233,30,99,0.4);
  }
  .mode-desc {
    font-size: 0.78rem;
    color: #666;
    margin-top: -4px;
    margin-bottom: 4px;
  }
  /* Game header */
  .game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: white;
    border-radius: 14px;
    padding: 10px 14px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .score-box, .progress-box {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text);
  }
  .progress-bar-bg {
    height: 8px;
    background: #E0E0E0;
    border-radius: 4px;
    margin-top: 10px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #66BB6A, #43A047);
    border-radius: 4px;
    transition: width 0.35s ease;
  }
  /* Question card */
  .q-card {
    background: white;
    border-radius: 18px;
    padding: 22px 18px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .q-type {
    font-size: 0.75rem;
    color: #888;
    text-align: center;
    margin-bottom: 6px;
  }
  .q-word {
    font-size: 2.4rem;
    font-weight: 800;
    text-align: center;
    color: var(--text);
    margin: 8px 0 14px;
    letter-spacing: 2px;
  }
  .q-text {
    font-size: 1.15rem;
    text-align: center;
    line-height: 1.55;
    margin-bottom: 18px;
    color: #333;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: auto;
  }
  .opt-btn {
    background: #F1F8E9;
    border: 2px solid #C8E6C9;
    border-radius: 12px;
    padding: 14px 12px;
    font-size: 1.05rem;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s;
    color: #333;
  }
  .opt-btn:hover { background: #DCEDC8; }
  .opt-btn.correct {
    background: #C8E6C9;
    border-color: var(--correct);
    color: #1B5E20;
    font-weight: 700;
  }
  .opt-btn.wrong {
    background: #FFCDD2;
    border-color: var(--wrong);
    color: #B71C1C;
  }
  .opt-btn:disabled { pointer-events: none; }
  /* Feedback */
  .feedback {
    text-align: center;
    margin-top: 14px;
    font-size: 1.05rem;
    font-weight: 700;
    min-height: 28px;
  }
  .feedback.ok { color: var(--correct); }
  .feedback.no { color: var(--wrong); }
  .next-btn {
    display: none;
    width: 100%;
    margin-top: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: white;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(255,152,0,0.35);
  }
  .next-btn.show { display: block; }
  /* Result screen */
  .result-card {
    background: white;
    border-radius: 20px;
    padding: 28px 20px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    margin-top: 20px;
  }
  .stars {
    font-size: 2.8rem;
    letter-spacing: 6px;
    margin: 12px 0;
  }
  .result-score {
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--text);
  }
  .result-msg {
    font-size: 1.15rem;
    margin: 12px 0 20px;
    color: #555;
  }
  .again-btn {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    border: none;
    border-radius: 14px;
    padding: 14px 28px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    margin: 6px;
    box-shadow: 0 4px 12px rgba(76,175,80,0.4);
  }
  .home-btn {
    background: #757575;
    color: white;
    border: none;
    border-radius: 14px;
    padding: 14px 28px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    margin: 6px;
  }
  /* Hint / note */
  .hint {
    font-size: 0.82rem;
    color: #666;
    background: #FFF8E1;
    border-radius: 8px;
    padding: 8px 10px;
    margin-top: 10px;
    display: none;
  }
  .hint.show { display: block; }
  /* Badge */
  .badge {
    display: inline-block;
    background: #FFECB3;
    color: #F57F17;
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 6px;
    vertical-align: middle;
  }
  footer {
    text-align: center;
    font-size: 0.7rem;
    color: #777;
    padding: 12px 0 4px;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🌲 二年級中文溫習遊戲</h1>
    <div class="sub">聖公會油塘基顯小學 · 第一學段</div>
  </header>

  <!-- HOME -->
  <div id="home" class="screen active">
    <div class="home-card">
      <div class="mascot">🐼</div>
      <p style="margin-bottom:16px;color:#555;font-size:0.95rem;">一起用遊戲溫習中文吧！選一個關卡開始～</p>
      
      <button class="mode-btn" onclick="startGame('vocab')">📚 詞語解釋關</button>
      <div class="mode-desc">看解釋，選出正確的詞語</div>
      
      <button class="mode-btn orange" onclick="startGame('sentence')">✏️ 例句填空關</button>
      <div class="mode-desc">每個詞語一題，把正確的詞語放進句子裏</div>
      
      <button class="mode-btn purple" onclick="startGame('structure')">🔤 字形結構關</button>
      <div class="mode-desc">左右、上下、左中右……你分得清嗎？</div>
      
      <button class="mode-btn blue" onclick="startGame('component')">🧩 部件識字關</button>
      <div class="mode-desc">耳、火、力、言 這些部件代表甚麼？</div>
      
      <button class="mode-btn pink" onclick="startGame('pattern')">📝 詞語與句子關</button>
      <div class="mode-desc">「的、地、得」同「一邊……一邊……」</div>
    </div>
  </div>

  <!-- GAME -->
  <div id="game" class="screen">
    <div class="game-header">
      <div class="score-box">⭐ <span id="score">0</span></div>
      <div class="progress-box"><span id="curQ">1</span> / <span id="totalQ">10</span></div>
    </div>
    <div class="progress-bar-bg"><div class="progress-bar" id="progBar" style="width:0%"></div></div>
    
    <div class="q-card">
      <div class="q-type" id="qType"></div>
      <div class="q-word" id="qWord"></div>
      <div class="q-text" id="qText"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div class="hint" id="hint"></div>
      <button class="next-btn" id="nextBtn" onclick="nextQuestion()">下一題 →</button>
    </div>
  </div>

  <!-- RESULT -->
  <div id="result" class="screen">
    <div class="result-card">
      <div class="mascot" id="resultMascot">🎉</div>
      <div class="stars" id="stars">⭐⭐⭐</div>
      <div class="result-score">得分：<span id="finalScore">0</span></div>
      <div class="result-msg" id="resultMsg">做得很好！</div>
      <button class="again-btn" onclick="restartSame()">再玩一次</button>
      <button class="home-btn" onclick="goHome()">返回主頁</button>
    </div>
  </div>

  <footer>內容取材自二年級中文科第一學段溫習冊</footer>
</div>

<script>
// ========== DATA ==========
const vocabData = [
  { word: "毛病", meaning: "指人的缺點或事物的瑕疵。", lesson: 2, wrongWords: ["錯誤", "道歉", "同意"] },
  { word: "橡皮", meaning: "用來擦掉筆跡的文具。", lesson: 2, wrongWords: ["抹", "澆", "重新"] },
  { word: "重新", meaning: "再一次；從頭開始。", lesson: 2, wrongWords: ["立即", "立刻", "開始"] },
  { word: "道歉", meaning: "承認錯誤，表示歉意。", lesson: 2, wrongWords: ["拒絕", "同意", "宣佈"] },
  { word: "同意", meaning: "與別人的意見相同。", lesson: 2, wrongWords: ["拒絕", "希望", "邀請"] },
  { word: "錯誤", meaning: "不正確。", lesson: 2, wrongWords: ["毛病", "道歉", "拒絕"] },
  { word: "賣", meaning: "拿東西換錢；出售。", lesson: 5, wrongWords: ["參加", "拒絕", "宣佈"] },
  { word: "參加", meaning: "加入某種活動或某種組織。", lesson: 5, wrongWords: ["邀請", "舉行", "拒絕"] },
  { word: "拒絕", meaning: "不接受別人的請求、意見等。", lesson: 5, wrongWords: ["同意", "邀請", "參加"] },
  { word: "勇敢", meaning: "不怕危險和困難；有膽量。", lesson: 5, wrongWords: ["立即", "準時", "滿足"] },
  { word: "立即", meaning: "表示動作行為緊接着某個時候；馬上。", lesson: 5, wrongWords: ["準時", "開始", "注意"] },
  { word: "宣佈", meaning: "公開説出來。", lesson: 6, wrongWords: ["開始", "注意", "邀請"] },
  { word: "注意", meaning: "把心思、思想放到某一方面；留心。", lesson: 6, wrongWords: ["開始", "滿足", "希望"] },
  { word: "開始", meaning: "從頭起；從某一點起。", lesson: 6, wrongWords: ["宣佈", "舉行", "邀請"] },
  { word: "澆", meaning: "水或別的液體落在物體上。", lesson: 6, wrongWords: ["抹", "搖擺", "滿足"] },
  { word: "大功告成", meaning: "指大的工程、事業或重要任務宣告完成。", lesson: 6, wrongWords: ["開始", "滿足", "準時"] },
  { word: "抹", meaning: "擦；拭；揩。", lesson: 6, wrongWords: ["澆", "搖擺", "注意"] },
  { word: "滿足", meaning: "感到滿意、足夠。", lesson: 6, wrongWords: ["希望", "勇敢", "注意"] },
  { word: "搖擺", meaning: "向相反的方向來回地移動。", lesson: 6, wrongWords: ["開始", "滿足", "注意"] },
  { word: "邀請", meaning: "請人到自己的地方來或到約定的地方去。", lesson: 7, wrongWords: ["參加", "舉行", "同意"] },
  { word: "舉行", meaning: "進行集會、比賽等。", lesson: 7, wrongWords: ["邀請", "開始", "宣佈"] },
  { word: "日期", meaning: "發生某一事情的確定的年、月、日或時期。", lesson: 7, wrongWords: ["時間", "地點", "希望"] },
  { word: "時間", meaning: "時候。", lesson: 7, wrongWords: ["日期", "地點", "立刻"] },
  { word: "地點", meaning: "所在的地方。", lesson: 7, wrongWords: ["時間", "日期", "希望"] },
  { word: "希望", meaning: "心裏想着達到某種目的或出現某種情況。", lesson: 7, wrongWords: ["滿足", "注意", "同意"] },
  { word: "立刻", meaning: "立即；馬上。", lesson: 7, wrongWords: ["準時", "開始", "注意"] },
  { word: "準時", meaning: "不遲於也不早於規定的時間。", lesson: 7, wrongWords: ["立刻", "立即", "開始"] }
];

const sentenceData = [
  { sentence: "志成的______是常常遲到，令和他約會的朋友很生氣。", answer: "毛病", options: ["毛病", "錯誤", "道歉", "同意"] },
  { sentence: "我檢查功課時，用______把多寫了的字擦掉。", answer: "橡皮", options: ["橡皮", "重新", "抹", "澆"] },
  { sentence: "你這道題做錯了，請______做一次吧！", answer: "重新", options: ["重新", "立即", "立刻", "準時"] },
  { sentence: "如果你主動向他______，他一定會原諒你的。", answer: "道歉", options: ["道歉", "拒絕", "同意", "宣佈"] },
  { sentence: "媽媽______給妹妹買一個新書包，妹妹十分高興。", answer: "同意", options: ["同意", "拒絕", "邀請", "希望"] },
  { sentence: "因為他主動承認______，所以我們原諒他。", answer: "錯誤", options: ["錯誤", "毛病", "道歉", "拒絕"] },
  { sentence: "她______掉房子，準備移民到加拿大去。", answer: "賣", options: ["賣", "買", "參加", "拒絕"] },
  { sentence: "我校的足球隊最近不斷練習，準備______下月舉行的決賽。", answer: "參加", options: ["參加", "邀請", "舉行", "拒絕"] },
  { sentence: "假如你不想出席他的生日會，可以直接______他的邀請。", answer: "拒絕", options: ["拒絕", "同意", "邀請", "參加"] },
  { sentence: "無論生活多麼艱難，我都會______地面對每一天。", answer: "勇敢", options: ["勇敢", "立即", "準時", "滿足"] },
  { sentence: "當火警發生時，大廈的居民______逃離火場。", answer: "立即", options: ["立即", "準時", "開始", "注意"] },
  { sentence: "這家老餅店突然______結業，大家都感到可惜。", answer: "宣佈", options: ["宣佈", "開始", "注意", "邀請"] },
  { sentence: "每個人都應該______個人衞生，保持環境清潔。", answer: "注意", options: ["注意", "開始", "滿足", "希望"] },
  { sentence: "新學年又______了，你有甚麼新的學習計劃？", answer: "開始", options: ["開始", "宣佈", "舉行", "邀請"] },
  { sentence: "記得每天要給這盆植物______水，否則它很快便會凋謝。", answer: "澆", options: ["澆", "抹", "搖擺", "滿足"] },
  { sentence: "在大家努力和合作下，這次活動終於______，圓滿結束。", answer: "大功告成", options: ["大功告成", "開始", "滿足", "準時"] },
  { sentence: "請把餐桌______乾淨，顧客快要進來了。", answer: "抹", options: ["抹", "澆", "搖擺", "注意"] },
  { sentence: "我有一個幸福的家庭，內心感到很______。", answer: "滿足", options: ["滿足", "希望", "勇敢", "注意"] },
  { sentence: "颱風吹襲，路旁的大樹被吹得______不定，十分危險。", answer: "搖擺", options: ["搖擺", "開始", "滿足", "注意"] },
  { sentence: "雪儀將要往外國升學，她______我參加她的歡送會。", answer: "邀請", options: ["邀請", "參加", "舉行", "同意"] },
  { sentence: "上學期的考試在十一月______，我要加緊温習。", answer: "舉行", options: ["舉行", "邀請", "開始", "宣佈"] },
  { sentence: "你知道今年賣物會舉行的______和地點嗎？", answer: "日期", options: ["日期", "時間", "地點", "希望"] },
  { sentence: "約定的______到了，他還沒有來，真不守時。", answer: "時間", options: ["時間", "日期", "地點", "立刻"] },
  { sentence: "爸爸工作的______距離市區很遠。", answer: "地點", options: ["地點", "時間", "日期", "希望"] },
  { sentence: "我在學期初就定下讀書計劃，______爭取好成績。", answer: "希望", options: ["希望", "滿足", "注意", "同意"] },
  { sentence: "當你不幸被蛇咬傷，應______看醫生。", answer: "立刻", options: ["立刻", "準時", "開始", "注意"] },
  { sentence: "明天是學校旅行，校長提醒同學要______回校。", answer: "準時", options: ["準時", "立刻", "立即", "開始"] }
];

const structureData = [
  { q: "「醒」屬於哪一種字形結構？", answer: "左右相等結構", options: ["左右相等結構", "左小右大結構", "左大右小結構", "上下相等結構"], note: "左右兩部分大小差不多。" },
  { q: "「滿」屬於哪一種字形結構？", answer: "左小右大結構", options: ["左小右大結構", "左右相等結構", "左大右小結構", "上小下大結構"], note: "左邊部分比右邊部分小。" },
  { q: "「到」屬於哪一種字形結構？", answer: "左大右小結構", options: ["左大右小結構", "左右相等結構", "左小右大結構", "上下相等結構"], note: "左邊部分比右邊部分大。" },
  { q: "「腳」屬於哪一種字形結構？", answer: "左中右大約相等", options: ["左中右大約相等", "左中右不相等", "左右相等結構", "上中下結構"], note: "左中右三部分所佔空間大致相等。" },
  { q: "「班」屬於哪一種字形結構？", answer: "左中右不相等", options: ["左中右不相等", "左中右大約相等", "左右相等結構", "上下結構"], note: "左中右三部分所佔空間不相等。" },
  { q: "「樂」屬於哪一種字形結構？", answer: "上下相等結構", options: ["上下相等結構", "上小下大結構", "上大下小結構", "左右相等結構"], note: "上下兩個部分比例大致相等。" },
  { q: "「買」屬於哪一種字形結構？", answer: "上小下大結構", options: ["上小下大結構", "上下相等結構", "上大下小結構", "左中右結構"], note: "上方部分比下方部分小。" },
  { q: "「與」屬於哪一種字形結構？", answer: "上大下小結構", options: ["上大下小結構", "上下相等結構", "上小下大結構", "左右結構"], note: "上方部分比下方部分大。" },
  { q: "「算」屬於哪一種字形結構？", answer: "上中下結構", options: ["上中下結構", "上下結構", "左中右結構", "左右結構"], note: "字可以從上到下劃分為三個明顯的部分。" },
  { q: "「意」屬於哪一種字形結構？", answer: "上中下結構", options: ["上中下結構", "上下結構", "左右結構", "左中右結構"], note: "上、中、下三部分都要寫得扁一些。" }
];

const componentData = [
  { q: "包含「耳」的字，大多跟甚麼有關？", answer: "耳朵或聲音", options: ["耳朵或聲音", "火或會發熱發光的東西", "花費力氣", "説話"], note: "例如：聰、聯、聆、聲、聾。" },
  { q: "「火」寫在字的下邊時，有時會變形為甚麼？", answer: "灬", options: ["灬", "冫", "衤", "扌"], note: "例如：熱、烈、災。" },
  { q: "包含「力」的字，大多跟甚麼有關？", answer: "花費力氣", options: ["花費力氣", "説話", "耳朵或聲音", "火"], note: "例如：勞、勢、勇、勸、助。" },
  { q: "包含「言」的字，大多跟甚麼有關？", answer: "説話", options: ["説話", "花費力氣", "耳朵或聲音", "火或熱"], note: "例如：請、語、詩、訴、訓、識。" },
  { q: "「耳」出現在字的左邊時，最底的橫畫要怎樣寫？", answer: "不穿頭，寫成「阝」形", options: ["不穿頭，寫成「阝」形", "要穿頭", "變成「又」", "變成「刂」"], note: "例如：聰、聯、聆。" },
  { q: "「火」寫在字的左邊時，會寫成甚麼？", answer: "火字旁（灬變形前）", options: ["火字旁（灬變形前）", "灬", "日", "月"], note: "例如：烤、燦、燈。" },
  { q: "「力」部件大多出現在字的哪個位置？", answer: "下方或右方", options: ["下方或右方", "上方或左方", "中間", "四個角"], note: "例如：勇、勞、勸、助。" },
  { q: "「言」寫在字的左邊時，要怎樣處理？", answer: "略為收窄", options: ["略為收窄", "寫得特別大", "變成「讠」", "省略一橫"], note: "例如：請、語、詩、訴。" }
];

const patternData = [
  { q: "「李老師拍拍我的肩」中的「拍拍」表示甚麼？", answer: "動作在短時間內輕鬆地重複或持續", options: ["動作在短時間內輕鬆地重複或持續", "動作很快完成", "動作很用力", "動作只做一次"], note: "重疊的動詞可表示動作重複和時間較短。" },
  { q: "「燦爛______綠光」中間應該填甚麼？", answer: "的", options: ["的", "地", "得", "了"], note: "形容詞和名詞中間加上「的」。" },
  { q: "「勇敢______踏出第一步吧」中間應該填甚麼？", answer: "地", options: ["地", "的", "得", "着"], note: "形容動作的詞語和表示動作的詞語之間加上「地」。" },
  { q: "「小美高興______跳起來」中間應該填甚麼？", answer: "得", options: ["得", "的", "地", "了"], note: "「得」字後面的文字幫助説明前面形容詞或動詞的情況。" },
  { q: "下列哪個是正面形容心情的詞語？", answer: "愉快", options: ["愉快", "生氣", "後悔", "悲哀"], note: "正面：開心、快樂、愉快、高興、興奮等。" },
  { q: "「我們一邊抹去額頭上的汗，一邊滿足地看着小樹苗。」這句用了甚麼句式？", answer: "一邊……一邊……", options: ["一邊……一邊……", "於是……", "因為……所以……", "不但……而且……"], note: "交代兩件事是同一時間做的。" },
  { q: "「文慧打算買禮物送給靜宜，於是請媽媽帶她去附近的商場逛逛。」這句用了甚麼連接詞？", answer: "於是", options: ["於是", "一邊", "但是", "雖然"], note: "前分句表示第一件事，後分句表示接着發生的第二件事。" },
  { q: "下列哪個是負面形容心情的詞語？", answer: "憤怒", options: ["憤怒", "興奮", "平靜", "好奇"], note: "負面：擔心、生氣、後悔、悲哀、憤怒等。" },
  { q: "「梅花鹿跑______很快」中間應該填甚麼？", answer: "得", options: ["得", "的", "地", "着"], note: "「得」幫助説明前面動詞的情況。" },
  { q: "重疊的動詞（例如「看看」）也可以表示甚麼意思？", answer: "嘗試、期望或要求", options: ["嘗試、期望或要求", "動作已經完成", "動作很慢", "動作很危險"], note: "例如：「這本故事書很有趣，你看看吧。」" }
];

// ========== GAME STATE ==========
let currentMode = "";
let questions = [];
let currentIndex = 0;
let score = 0;
let answered = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startGame(mode) {
  currentMode = mode;
  score = 0;
  currentIndex = 0;
  answered = false;

  if (mode === "vocab") {
    // 問解釋 → 選詞語（每個詞語一題）
    questions = shuffle(vocabData).map(item => ({
      type: "詞語解釋",
      word: "",
      text: item.meaning,
      answer: item.word,
      options: shuffle([item.word, ...item.wrongWords]),
      hint: `第${item.lesson}課`
    }));
  } else if (mode === "sentence") {
    // 每個詞語一題，全部出題
    questions = shuffle(sentenceData).map(item => ({
      type: "例句填空",
      word: "",
      text: item.sentence,
      answer: item.answer,
      options: shuffle(item.options),
      hint: ""
    }));
  } else if (mode === "structure") {
    questions = shuffle(structureData).slice(0, 8).map(item => ({
      type: "字形結構",
      word: "",
      text: item.q,
      answer: item.answer,
      options: shuffle(item.options),
      hint: item.note
    }));
  } else if (mode === "component") {
    questions = shuffle(componentData).slice(0, 8).map(item => ({
      type: "部件識字",
      word: "",
      text: item.q,
      answer: item.answer,
      options: shuffle(item.options),
      hint: item.note
    }));
  } else if (mode === "pattern") {
    questions = shuffle(patternData).slice(0, 8).map(item => ({
      type: "詞語與句子",
      word: "",
      text: item.q,
      answer: item.answer,
      options: shuffle(item.options),
      hint: item.note
    }));
  }

  document.getElementById("home").classList.remove("active");
  document.getElementById("result").classList.remove("active");
  document.getElementById("game").classList.add("active");
  document.getElementById("totalQ").textContent = questions.length;
  showQuestion();
}

function showQuestion() {
  answered = false;
  const q = questions[currentIndex];
  document.getElementById("curQ").textContent = currentIndex + 1;
  document.getElementById("score").textContent = score;
  document.getElementById("progBar").style.width = ((currentIndex) / questions.length * 100) + "%";
  document.getElementById("qType").textContent = q.type + (q.hint ? " · " + q.hint : "");
  document.getElementById("qWord").textContent = q.word || "";
  document.getElementById("qWord").style.display = q.word ? "block" : "none";
  // 詞語解釋關：顯示解釋，請學生選詞語
  if (q.type === "詞語解釋") {
    document.getElementById("qText").innerHTML = "下列解釋對應哪個詞語？<br><br><strong style='font-size:1.25rem;color:#2E7D32'>" + q.text + "</strong>";
  } else {
    document.getElementById("qText").textContent = q.text;
  }
  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className = "feedback";
  document.getElementById("hint").className = "hint";
  document.getElementById("hint").textContent = q.hint || "";
  document.getElementById("nextBtn").classList.remove("show");

  const opts = document.getElementById("options");
  opts.innerHTML = "";
  q.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(btn, opt, q.answer);
    opts.appendChild(btn);
  });
}

function selectAnswer(btn, selected, correct) {
  if (answered) return;
  answered = true;
  const allBtns = document.querySelectorAll(".opt-btn");
  allBtns.forEach(b => {
    b.disabled = true;
    if (b.textContent === correct) b.classList.add("correct");
  });

  const fb = document.getElementById("feedback");
  const hint = document.getElementById("hint");

  if (selected === correct) {
    score += 10;
    document.getElementById("score").textContent = score;
    fb.textContent = "✓ 答對了！真棒！";
    fb.className = "feedback ok";
  } else {
    btn.classList.add("wrong");
    fb.textContent = "✗ 再想想～答案是：「" + correct + "」";
    fb.className = "feedback no";
  }
  if (hint.textContent) hint.classList.add("show");
  document.getElementById("nextBtn").classList.add("show");
  document.getElementById("progBar").style.width = ((currentIndex + 1) / questions.length * 100) + "%";
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= questions.length) {
    showResult();
  } else {
    showQuestion();
  }
}

function showResult() {
  document.getElementById("game").classList.remove("active");
  document.getElementById("result").classList.add("active");
  const maxScore = questions.length * 10;
  const percent = score / maxScore;
  document.getElementById("finalScore").textContent = score + " / " + maxScore;

  let stars = "⭐";
  let msg = "繼續努力，下次會更好！";
  let mascot = "💪";
  if (percent >= 0.9) {
    stars = "⭐⭐⭐";
    msg = "太厲害了！你是中文小高手！";
    mascot = "🏆";
  } else if (percent >= 0.7) {
    stars = "⭐⭐";
    msg = "做得很好！再溫習一下就更棒了！";
    mascot = "🎉";
  } else if (percent >= 0.5) {
    stars = "⭐";
    msg = "不錯喔！多玩幾次就會記住了！";
    mascot = "👍";
  }
  document.getElementById("stars").textContent = stars;
  document.getElementById("resultMsg").textContent = msg;
  document.getElementById("resultMascot").textContent = mascot;
}

function restartSame() {
  startGame(currentMode);
}

function goHome() {
  document.getElementById("result").classList.remove("active");
  document.getElementById("game").classList.remove("active");
  document.getElementById("home").classList.add("active");
}
</script>
